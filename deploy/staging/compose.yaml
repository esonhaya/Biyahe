name: biyahe-staging

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:?Set DB_ADMIN_USERNAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db_admin_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 256
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: deploy/staging/api.Dockerfile
    environment:
      APP_NAME: Biyahe
      APP_ENV: ${APP_ENV:?APP_ENV must be staging}
      APP_DEBUG: ${APP_DEBUG:?APP_DEBUG must be false}
      APP_URL: ${APP_URL:?Set APP_URL}
      APP_KEY_SOURCE_FILE: /run/secrets/app_key
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_CONNECTION: ${DB_CONNECTION:?DB_CONNECTION must be pgsql}
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD_SOURCE_FILE: /run/secrets/db_app_password
      BIYAHE_OFFLINE_WALKING_PREVIEW: ${BIYAHE_OFFLINE_WALKING_PREVIEW:-false}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    secrets:
      - app_key
      - db_app_password
    tmpfs:
      - /run/biyahe-secrets:rw,noexec,nosuid,size=1m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$s=@file_get_contents('http://127.0.0.1:8080/up'); exit($s===false?1:0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1.00
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [internal]

  web:
    build:
      context: ../..
      dockerfile: deploy/staging/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        BIYAHE_API_INTERNAL_URL: ${BIYAHE_API_INTERNAL_URL:-http://gateway/api/v1}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.00
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [internal]

  gateway:
    image: nginx:1.31.6-alpine3.24
    environment:
      STAGING_ALLOWED_HOSTS: ${STAGING_ALLOWED_HOSTS:-localhost}
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --header='Host: localhost' -q -O /dev/null http://127.0.0.1:8080/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [internal]

secrets:
  app_key:
    file: ${APP_KEY_SECRET_FILE:?Set APP_KEY_SECRET_FILE}
  db_app_password:
    file: ${DB_PASSWORD_SECRET_FILE:?Set DB_PASSWORD_SECRET_FILE}
  db_admin_password:
    file: ${DB_ADMIN_PASSWORD_SECRET_FILE:?Set DB_ADMIN_PASSWORD_SECRET_FILE}

volumes:
  postgres-data:
    name: biyahe-staging-postgres-data

networks:
  internal:
    internal: true
